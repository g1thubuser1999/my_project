{% extends 'layouts/base.html' %}
{% load static %}
{% load i18n %}

{% block content %}

<div class="container-fluid bg-light py-5">
    <div class="col-md-6 m-auto text-center">
        <h1 class="h1">{% trans "Contact Us" %}</h1>
        <p>
            {% trans "If you have any questions, feel free to contact us." %}
        </p>
    </div>
</div>

<div class="container py-5">
    <div class="row py-5">
        <form class="col-md-9 m-auto" method="post" role="form">
            {% csrf_token %}

            <div class="row">
                <div class="form-group col-md-6 mb-3">
                    <label for="name">{% trans "Name" %}</label>
                    <input type="text" class="form-control mt-1" id="name" name="name" placeholder="{% trans 'Name' %}" required>
                </div>
                <div class="form-group col-md-6 mb-3">
                    <label for="email">{% trans "Email" %}</label>
                    <input type="email" class="form-control mt-1" id="email" name="email" placeholder="{% trans 'Email' %}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="subject">{% trans "Subject" %}</label>
                <input type="text" class="form-control mt-1" id="subject" name="subject" placeholder="{% trans 'Subject' %}" required>
            </div>

            <div class="mb-3">
                <label for="message">{% trans "Message" %}</label>
                <textarea class="form-control mt-1" id="message" name="message" placeholder="{% trans 'Message' %}" rows="8" required></textarea>
            </div>

            <div class="row">
                <div class="col text-end mt-2">
                    <button type="submit" class="btn btn-success btn-lg px-3">
                        {% trans "Let's Talk" %}
                    </button>
                </div>
            </div>
        </form>
    </div>

    <div class="row mt-5">
        <div class="col-md-8 m-auto text-center">
            <h2 class="h4 mb-3">{% trans "Our Location" %}</h2>
            <p class="mb-0">
                <i class="fas fa-map-marker-alt text-success me-2"></i>
                {% trans "123 Consectetur at ligula 10660" %}
            </p>
        </div>
    </div>
</div>

{% endblock %}
